name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject default config into config.js
        run: |
          cat > config.js << EOF
          window.T2D_CONFIG = {
            apiBase: '${{ secrets.LLM_API_BASE }}',
            apiKey: '${{ secrets.LLM_API_KEY }}',
            model: '${{ secrets.LLM_MODEL }}'
          };
          EOF
          echo "config.js generated"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
